name: Nix Flake Update

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to update flake for'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to update flake for'
        type: string
        required: true

jobs:
  update-flake:
    name: Update Nix Flake
    runs-on: ubuntu-latest

    steps:
      - name: Clone nix repository
        uses: actions/checkout@v7
        with:
          repository: fagramdesktop/nix
          token: ${{ secrets.PAT }}
          path: nix

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Prefetch prebuilt binary asset
        id: prefetch_binary
        run: |
          TAG="${{ inputs.release_tag }}"
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/fagram-${TAG}.tar.zst"
          echo "Downloading binary from: $ASSET_URL"
          curl -L -o fagram.tar.zst "$ASSET_URL"

          HEX_HASH=$(sha256sum fagram.tar.zst | awk '{print $1}')
          SRI_HASH=$(python3 -c "import base64; print('sha256-' + base64.b64encode(bytes.fromhex('$HEX_HASH')).decode())")
          echo "Binary Hash: $SRI_HASH"
          echo "binary_hash=$SRI_HASH" >> $GITHUB_OUTPUT

      - name: Prefetch source and compute hash
        id: prefetch_source
        run: |
          OWNER="fagramdesktop"
          REPO="fadesktop"
          TAG="${{ inputs.release_tag }}"

          REV=$(curl -sf "https://api.github.com/repos/${OWNER}/${REPO}/git/ref/tags/${TAG}" \
            | jq -r '.object.sha')

          if [ "$REV" = "null" ] || [ -z "$REV" ]; then
            echo "::error::Could not resolve tag ${TAG} to a commit"
            exit 1
          fi
          echo "Resolved tag ${TAG} to commit ${REV}"

          PREFETCH_JSON=$(nix shell nixpkgs#nix-prefetch-git -c nix-prefetch-git \
            --url "https://github.com/${OWNER}/${REPO}" \
            --rev "$REV" \
            --fetch-submodules \
            --quiet)

          HASH=$(echo "$PREFETCH_JSON" | jq -r '.hash')
          echo "Source Hash: $HASH"
          echo "Source Rev: $REV"

          echo "rev=$REV" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Update derivations in nix repo
        run: |
          VERSION="${{ inputs.release_tag }}"
          BINARY_HASH="${{ steps.prefetch_binary.outputs.binary_hash }}"
          REV="${{ steps.prefetch_source.outputs.rev }}"
          SOURCE_HASH="${{ steps.prefetch_source.outputs.hash }}"

          cd nix

          # Update prebuilt binary derivation
          sed -i "s|version = \".*\";|version = \"${VERSION}\";|" pkgs/binary.nix
          sed -i "s|hash = \".*\";|hash = \"${BINARY_HASH}\";|" pkgs/binary.nix

          # Update source build derivation
          sed -i "s|version = \".*\";|version = \"${VERSION}\";|" pkgs/unwrapped.nix
          sed -i "s|rev = \".*\";|rev = \"${REV}\";|" pkgs/unwrapped.nix
          sed -i "s|hash = \".*\";|hash = \"${SOURCE_HASH}\";|" pkgs/unwrapped.nix

          echo "Updated pkgs/binary.nix:"
          cat pkgs/binary.nix

          echo "Updated pkgs/unwrapped.nix:"
          cat pkgs/unwrapped.nix

      - name: Commit and push changes
        run: |
          cd nix
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/binary.nix pkgs/unwrapped.nix
          git commit -m "nix: update to ${{ inputs.release_tag }}"
          git push
